<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Tracker</title>
</head>
<body>
    <h1>Analytics Tracking Page</h1>
    <p>If you see this, a request was made.</p>

    <script>
        // Google Analytics Configuration
        const MEASUREMENT_ID = "G-T0TLV56Y0C";
        const API_SECRET = "2dD6iqHQQl2EzhCvHXA7EQ";

        // Extract Query Parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || 'unknown_user';
        const event = urlParams.get('event') || 'page_visit';
        const extraData = urlParams.get('extra') || '';

        // Prepare Google Analytics Event Data
        const GA_ENDPOINT = `https://www.google-analytics.com/mp/collect?measurement_id=${MEASUREMENT_ID}&api_secret=${API_SECRET}`;
        const clientId = Math.random().toString(36).substring(2, 15); // Generate a random Client ID

        const eventData = {
            client_id: clientId,
            events: [{
                name: event,
                params: {
                    user_id: userId,
                    extra_info: extraData,
                    page_location: window.location.href
                }
            }]
        };

        // Send Data to Google Analytics
        fetch(GA_ENDPOINT, {
            method: "POST",
            body: JSON.stringify(eventData),
            headers: { "Content-Type": "application/json" }
        }).then(response => {
            console.log("Event sent:", response.status);
        }).catch(error => {
            console.error("Error sending event:", error);
        });
    </script>
</body>
</html>
